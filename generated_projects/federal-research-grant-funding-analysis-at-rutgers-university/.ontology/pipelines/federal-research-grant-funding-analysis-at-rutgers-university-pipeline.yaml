name: federal-research-grant-funding-analysis-at-rutgers-university-pipeline
ontology: federal-research-grant-funding-analysis-at-rutgers-university-ontology
steps:
  - name: fetch-usaspending-rutgers-assistance
    source: federal-research-grant-funding-analysis-at-rutgers-university-usaspending-gov
    output: topics/data/raw/usaspending_rutgers_assistance.json
    notes: Fetches public USAspending Rutgers assistance awards for FY2021-FY2025.
  - name: fetch-nsf-rutgers-awards
    source: federal-research-grant-funding-analysis-at-rutgers-university-nsf-award-search
    output: topics/data/raw/nsf_awards_rutgers.json
    notes: Fetches public NSF award records matching Rutgers for the same window.
  - name: build-public-award-panel
    transform: scripts/build_research_artifacts.py
    output: topics/data/processed/federal_awards_rutgers_fy2021_fy2025.csv
    notes: Normalizes public award records and registers rail truth state.
