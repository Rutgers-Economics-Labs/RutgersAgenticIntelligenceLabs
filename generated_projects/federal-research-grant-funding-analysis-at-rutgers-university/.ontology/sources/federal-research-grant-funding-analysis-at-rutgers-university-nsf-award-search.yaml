name: federal-research-grant-funding-analysis-at-rutgers-university-nsf-award-search
type: api
url: https://www.research.gov/awardapi-service/v1/awards.json
response_format: json
description: |
  Public NSF Awards API query used as a research-award detail cross-check for
  Rutgers award records.
fields:
  - source: id
    alias: award_id
  - source: awardeeName
    alias: recipient
  - source: fundsObligatedAmt
    alias: amount
  - source: title
    alias: title
