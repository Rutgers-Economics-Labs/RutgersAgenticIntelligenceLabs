schema_version: 1
research_type: descriptive
causal_claim_allowed: false
claim_strength_policy:
  allowed_claim_types:
    - descriptive
    - correlational
  forbidden_without_identification:
    - causal
    - policy_effect
    - treatment_effect
causal_identification:
  treatment: ""
  outcome: ""
  unit_of_analysis: ""
  comparison_group: ""
  timing: ""
  identifying_assumption: ""
  threats_to_identification: []
estimation:
  primary_method: public-award concentration analysis
  analysis_scripts:
    - scripts/build_research_artifacts.py
  model_output_artifacts:
    - artifacts/analysis_summary.csv
    - artifacts/funding_dashboard.csv
  requires_standard_errors: false
robustness:
  required_checks: []
  completed_checks:
    - source-overlap check
    - timing-cohort separation
    - public-feed limitation review
  artifacts:
    - artifacts/analysis_summary.csv
    - artifacts/source_quality_notes.md
review:
  requires_reviewer_critique: true
  reviewer_critique_path: research_plan/reviewer_2_report.md
