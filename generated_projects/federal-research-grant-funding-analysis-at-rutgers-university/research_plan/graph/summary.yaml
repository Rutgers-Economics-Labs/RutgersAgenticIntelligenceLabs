title: Federal Research Grant Funding Analysis at Rutgers University
summary: An analysis of the distribution, trends, and volume of federal research grant
  funding across various academic departments and units at Rutgers University.
audience: University administrators, department heads, research policy makers
objective: To quantify and compare federal funding levels across departments to identify
  institutional strengths and resource allocation patterns.
causal_questions:
- What factors influence the variance in federal funding levels between academic departments?
- How do changes in federal agency priorities impact departmental research revenue?
outcomes:
- Total federal funding amount
- Grant award frequency
- Funding growth rates
- Departmental funding rankings
units_of_analysis:
- Academic departments
- Research centers
- Individual grants
geographies:
- Rutgers University campuses
- United States
time_windows:
- Fiscal years
- Multi-year longitudinal periods
methods:
- Descriptive statistics
- Trend analysis
- Comparative benchmarking
- Data aggregation
deliverables:
- Funding dashboard
- Analytical report
- Departmental performance profiles
controls:
- Department size
- Disciplinary field
- Faculty headcount
- Historical funding baseline
entities:
- RutgersUniversity
- FederalFundingAgencies
- AcademicDepartments
- PrincipalInvestigators
- ResearchCenters
- IndividualGrants
measures:
- Award dollar amount
- Number of active awards
- Success rate
- Indirect cost recovery
- Total federal funding amount
- Grant award frequency
- Funding growth rates
- Departmental funding rankings
source_hints:
- USAspending.gov
- NIH RePORTER
- NSF Award Search
- University Office of Research financial reports
