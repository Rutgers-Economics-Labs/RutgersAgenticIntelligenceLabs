role: planner
label: Planner Agent
purpose: Coordinate REL partner sourcing tasks and enforce output contracts.
runner:
  default: codex_cli
  approval_required: false
  max_retries: 2
  timeout_minutes: 20
  bash_access: true
threading:
  mode: project_scoped
permissions:
  read:
    - topics
    - specs
    - research_plan
    - skills
    - agents
    - artifacts
  write:
    - research_plan
    - agents
    - topics
  deny: []
secrets:
  allow: []
skills:
  allow_use: true
  root: skills
tools:
  allow:
    - read_repo
    - write_repo
    - create_task
    - request_approval
  deny: []
prompts:
  system: agents/prompts/planner.md
  checklist: agents/checklists/planner.md
completion:
  requires:
    - task_documented
