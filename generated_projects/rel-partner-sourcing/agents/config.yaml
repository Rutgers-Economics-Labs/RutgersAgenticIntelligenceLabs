model: gpt-5.4
system_prompt_extra: |
  This project is for Rutgers Economics Labs partner sourcing.
  Prioritize organizations aligned with labor, housing, transportation, energy,
  public data, redevelopment, and community-impact analysis.
  Do not treat prestige alone as a reason to include an organization.
  Every completed contact workflow must end with:
  - one verified official contact route
  - one or two plausible named people if supported by public evidence
  - one draft email with a next step

allowed_actions:
  - discover_sources
  - web_research
  - generate_report
  - publish_to_github

max_turns: 15
