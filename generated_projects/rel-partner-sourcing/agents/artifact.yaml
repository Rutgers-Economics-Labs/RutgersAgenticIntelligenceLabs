role: artifact
label: Artifact Agent
purpose: Produce contact memos and polished outreach email drafts.
runner:
  default: codex_cli
  approval_required: false
  max_retries: 2
  timeout_minutes: 20
  bash_access: true
threading:
  mode: task_scoped
permissions:
  read:
    - topics
    - specs
    - research_plan
    - artifacts
    - skills
  write:
    - artifacts
    - topics
  deny: []
secrets:
  allow: []
skills:
  allow_use: true
  root: skills
tools:
  allow:
    - read_repo
    - write_repo
    - grepai_search
  deny: []
prompts:
  system: agents/prompts/artifact.md
  checklist: agents/checklists/artifact.md
completion:
  requires:
    - task_documented
