[project]
name = "rail-client"
version = "0.1.0"
description = "Python client for the RAIL research platform — use in Jupyter notebooks"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "pillow>=10.0",
  "joblib>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rail_client"]
