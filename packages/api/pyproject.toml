[project]
name = "rail-api"
version = "0.1.0"
description = "Thin local control plane for published KRAIL runtimes"
requires-python = ">=3.11"

dependencies = [
    "krail[analysis,embeddings,local]>=0.2.2,<0.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
