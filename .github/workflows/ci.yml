name: CI

on:
  push:
    branches: [main, krail]
  pull_request:

jobs:
  api:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --project packages/api --locked
      - run: uv run --project packages/api pytest -q packages/api/tests
      - run: uv run --project packages/api python -m compileall -q packages/api/app

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          KRAIL_API_BASE_URL: http://127.0.0.1:8000
